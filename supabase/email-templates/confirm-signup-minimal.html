<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Confirm your 1-Apply account</title>
</head>
<body style="margin:0;padding:0;background:#fdfff8;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#151414;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#fdfff8;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#fff;border:1px solid #e0eadd;border-radius:12px;">
          <tr>
            <td style="height:4px;background:#5adeb7;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px;">
              <p style="margin:0 0 8px;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#767676;">Application memory</p>
              <h1 style="margin:0 0 16px;font-family:Georgia,Times New Roman,serif;font-size:28px;font-weight:400;">Confirm your email</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#5a5a5a;">
                Confirm <strong>{{ .Email }}</strong> to finish creating your 1-Apply account.
              </p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#151414;color:#fff;text-decoration:none;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;">
                Confirm email address
              </a>
              <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#767676;word-break:break-all;">
                Or open: {{ .ConfirmationURL }}
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px;border-top:1px solid #e0eadd;background:#f3f7eb;font-size:12px;color:#767676;">
              If you did not sign up, ignore this email.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
