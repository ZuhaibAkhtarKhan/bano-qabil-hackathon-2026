<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>1-Apply</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="wordmark" aria-label="1 Apply">
        <span class="wordmark-mark" aria-hidden="true">
          <img src="icons/brand-mark.jpg" width="28" height="28" alt="" />
        </span>
        <span class="wordmark-label">Apply</span>
      </div>
      <h1>Prepare, don’t submit</h1>
    </header>
    <p id="status" class="muted">Sign in to 1-Apply in this browser, then Connect in Options.</p>
    <p id="session" class="session hidden"></p>
    <div class="row">
      <button id="save" type="button">Save to 1-Apply</button>
      <button id="fill" type="button" class="secondary">Fill from memory</button>
    </div>
    <div class="row">
      <button id="stop" type="button" class="danger hidden">Stop filling</button>
    </div>
    <label class="field">
      Application
      <select id="application"></select>
    </label>
    <p id="match" class="muted match"></p>
    <p id="hazard" class="hazard hidden"></p>
    <p id="log" class="log"></p>
    <p class="footer"><button id="options" type="button" class="ghost">Options</button></p>
    <script src="popup.js" type="module"></script>
  </body>
</html>
