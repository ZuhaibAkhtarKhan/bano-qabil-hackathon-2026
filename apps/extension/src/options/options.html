<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>1-Apply extension</title>
    <link rel="stylesheet" href="popup.css" />
    <style>body { width: auto; max-width: 40rem; margin: 2rem auto; }</style>
  </head>
  <body>
    <div class="wordmark" aria-label="1 Apply" style="margin-bottom: 10px;">
      <span class="wordmark-mark" aria-hidden="true">
        <img src="icons/brand-mark.jpg" width="28" height="28" alt="" />
      </span>
      <span class="wordmark-label">Apply</span>
    </div>
    <h1>Extension options</h1>
    <p class="muted">
      Point the extension at your 1-Apply deployment, sign in in this browser, then connect. The extension uses that
      session for save, scan, and fill — never submit, sign, pay, or CAPTCHA bypass.
    </p>
    <div class="row" style="flex-direction: column; align-items: stretch; gap: 0.5rem;">
      <label for="app-url" class="muted">1-Apply URL</label>
      <input id="app-url" type="url" placeholder="http://localhost:3000" style="padding: 0.5rem 0.75rem; border-radius: 0.5rem; border: 1px solid #ddd;" />
      <div class="row">
        <button id="save-url" type="button">Save URL</button>
        <button id="connect" type="button">Connect with website session</button>
      </div>
    </div>
    <p id="log" class="log"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
